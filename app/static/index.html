<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>모의 이체</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main><header class="top"><span class="brand">FDS <span>모의뱅킹</span></span><span class="demo">테스트</span></header>
<nav aria-label="메뉴"><button class="tab active" data-panel="manual" aria-selected="true">계좌 이체</button><button class="tab" data-panel="security-panel" aria-selected="false">보안 알림 <span id="alert-badge" class="badge" hidden></span></button><button class="tab" data-panel="stats-panel" aria-selected="false">거래 통계</button><button class="tab" data-panel="history-panel" aria-selected="false">거래 내역</button><button class="tab" data-panel="public" aria-selected="false">공개 사례 분석</button></nav>
<section id="manual" class="panel"><div class="title"><span class="step">TRANSFER</span><h1 id="manual-title">어디로 보낼까요?</h1></div><form id="form"><button class="random" id="random-fill" type="button">무작위 거래 입력</button><div class="fields"><div><label for="bank">받는 은행</label><select id="bank" required><option value="">은행 선택</option><option>가상은행</option><option>테스트은행</option><option>모의저축은행</option></select></div><div><label for="account">받는 계좌번호</label><input id="account" type="text" inputmode="numeric" pattern="[0-9]{6,20}" maxlength="20" placeholder="숫자만 입력" required></div><div><label for="recipient">받는 분</label><input id="recipient" maxlength="30" placeholder="이름 입력" required></div><div><label for="amount">보낼 금액</label><div class="amount-wrap"><input id="amount" type="number" min="0.01" max="1000000000" step="0.01" placeholder="금액 입력" required><span>원</span></div></div><div><label for="oldbalance">모의 출금 계좌 잔액</label><div class="amount-wrap"><input id="oldbalance" type="number" min="0" max="1000000000" step="0.01" value="1000000" required><span>원</span></div></div></div><div class="fields extra"><div><label for="hour">거래 시간 (0~23시)</label><input id="hour" type="number" min="0" max="23" required></div><div><label for="distance">직전 거래 위치와의 거리 (km)</label><input id="distance" type="number" min="0" max="12000" step="0.01" value="5" required></div></div><p class="note">받는 계좌는 화면 확인용이며 잔액은 변동되지 않습니다.</p><button class="primary" type="submit">다음</button></form>
<section id="confirm" hidden><h2>이체 정보를 확인해 주세요</h2><dl class="summary"><div><dt>받는 분</dt><dd id="confirm-recipient"></dd></div><div><dt>받는 계좌</dt><dd id="confirm-account"></dd></div><div><dt>이체 금액</dt><dd id="confirm-amount"></dd></div><div><dt>출금 전 잔액</dt><dd id="confirm-balance"></dd></div><div><dt>거래 시간</dt><dd id="confirm-hour"></dd></div><div><dt>직전 거래와 거리</dt><dd id="confirm-distance"></dd></div></dl><div class="actions"><button id="edit" class="secondary" type="button">수정</button><button id="send" class="primary" type="button">이체하기</button></div></section></section>
<section id="public" class="panel" hidden><div class="title"><span class="step">TEST DATA</span><h1>공개 사례 분석</h1></div><label for="example">거래 사례</label><select id="example"><option>사례를 불러오는 중...</option></select><button class="primary" id="run-public">분석하기</button></section>
<section id="stats-panel" class="panel" hidden><div class="heading"><div><h1>거래 통계</h1><p class="note">최근 7일 · 한국 시간</p></div><button id="refresh-stats" type="button">새로고침</button></div><div id="stats-content" aria-live="polite"><p class="note">불러오는 중...</p></div></section>
<section id="security-panel" class="panel" hidden><div class="heading"><h1>보안 알림</h1><button id="refresh-alerts" type="button">새로고침</button></div><p id="security-status" class="note" role="status">연결 중</p><div id="alerts"></div></section>
<div id="alert-banner" class="alert-banner" role="status" hidden></div><section id="result" class="result" aria-live="polite" hidden></section><p id="error" role="alert" class="error" hidden></p><section id="history-panel" class="history panel" hidden><div class="heading"><h1>거래 내역</h1><button id="refresh" type="button">새로고침</button></div><div id="history">불러오는 중...</div></section></main><script src="/static/app.js"></script></body></html>
